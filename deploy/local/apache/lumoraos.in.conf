# XAMPP Apache: serves https://lumoraos.in on this PC from the local Docker stack (deploy/local).
# Included from C:/xampp/apache/conf/extra/httpd-vhosts.conf by setup.ps1. Same routing as the
# production deploy/apache/lumoraos.in.conf. Certificate: deploy/local/certs (self-signed, git-ignored).

<IfModule !proxy_http_module>
  LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>
<IfModule !proxy_wstunnel_module>
  LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
</IfModule>

Define LUMORA_LOCAL "C:/xampp/htdocs/contentosai/deploy/local"

<VirtualHost *:80>
  ServerName lumoraos.in
  ServerAlias www.lumoraos.in
  Redirect permanent / https://lumoraos.in/
</VirtualHost>

<VirtualHost *:443>
  ServerName lumoraos.in
  ServerAlias www.lumoraos.in

  SSLEngine on
  SSLCertificateFile "${LUMORA_LOCAL}/certs/lumoraos.in.crt"
  SSLCertificateKeyFile "${LUMORA_LOCAL}/certs/lumoraos.in.key"

  ErrorLog "logs/lumoraos.in-error.log"
  CustomLog "logs/lumoraos.in-access.log" common

  ProxyPreserveHost On
  ProxyRequests Off
  LimitRequestBody 0
  # Video generation requests can run long; production still has the 60 s limit (see CLAUDE.md Pending).
  ProxyTimeout 300

  RequestHeader set X-Forwarded-Proto "https"
  RequestHeader set X-Forwarded-Port "443"

  ProxyPass        /api/v1 http://127.0.0.1:3000/api/v1 retry=0
  ProxyPassReverse /api/v1 http://127.0.0.1:3000/api/v1

  ProxyPass        /storage/uploads http://127.0.0.1:3000/storage/uploads retry=0
  ProxyPassReverse /storage/uploads http://127.0.0.1:3000/storage/uploads

  ProxyPass        / http://127.0.0.1:3100/ retry=0
  ProxyPassReverse / http://127.0.0.1:3100/
</VirtualHost>
