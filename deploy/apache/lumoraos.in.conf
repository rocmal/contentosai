# Apache reverse-proxy config for https://lumoraos.in - PREFERRED option.
#
# IMPORTANT, discovered 2026-08-12: this VPS actually runs LiteSpeed Web
# Server (phpinfo() showed PHP compiled --enable-litespeed, Server API
# CGI/FastCGI via LSAPI), not stock Apache httpd, even though cPanel still
# calls this "Apache" throughout its UI. LiteSpeed reads the same
# httpd-format vhost/userdata config cPanel generates (this file should
# still apply as-is), but it has its OWN proxy implementation, not
# Apache's mod_proxy - "enable mod_proxy in EasyApache4" may not be the
# right fix if this doesn't work. A [P]-flag rewrite rule from
# deploy/apache/htaccess.fallback returned HTTP 500 on this box as of
# 2026-08-12 (confirmed caused by the rule itself, not something else -
# removing it entirely fixed the 500). Whoever has root should check the
# actual LiteSpeed/Apache error log (not readable by the cPanel account)
# for the precise cause before assuming which fix applies.
#
# Single domain, path-based split (both apps run in Docker):
#   - /api/v1/*           -> NestJS API container (127.0.0.1:3000 - this
#     container uses network_mode: host, not a mapped port, see
#     deploy/docker-compose.yml for why)
#   - /storage/uploads/*  -> same API container, same port
#     (main.ts serves uploaded files from this exact prefix - see
#     apps/api/src/main.ts useStaticAssets)
#   - everything else     -> Express/Vite web container (127.0.0.1:3100,
#     normal bridge-network port mapping)
#     (this also covers the web app's own legacy /api/health, /api/generate,
#     /api/brand-brain/extract, /api/copilot, /api/agents/run routes -
#     those are unversioned, so they never collide with /api/v1/*)
#
# WHERE THIS FILE GOES (requires root/WHM - see deploy/README.md "One-time
# root/admin setup"):
#   /etc/apache2/conf.d/userdata/ssl/2_4/lumoosr/lumoraos.in/proxy.conf
# (cPanel's per-vhost include directory for the SSL vhost - the plain-HTTP
# vhost already redirects to HTTPS via cPanel's AutoSSL, so only the ssl/
# path needs this). Then, as root:
#   /usr/local/cpanel/scripts/rebuildhttpdconf
#   /scripts/restartsrv_httpd
# This regenerates lumoraos.in's real vhost with this file auto-included -
# do NOT hand-edit /etc/apache2/conf.d/httpd.conf directly, cPanel will
# overwrite it on the next "Rebuild Apache Configuration" or AutoSSL run.
#
# PREREQUISITE (root/WHM, one-time): on stock Apache this would be
# mod_proxy + mod_proxy_http via WHM > EasyApache 4 > Customize > Apache
# Modules (mod_proxy_wstunnel only if/when a WebSocket gateway is added -
# none is wired up as of this writing, despite @nestjs/platform-socket.io
# being an installed dependency). On LiteSpeed (this box), the equivalent
# is whatever LiteSpeed WebAdmin needs for .htaccess-level proxy rewrite
# support to work - confirm with root, don't assume it's the same toggle.

ProxyPreserveHost On
ProxyRequests Off

# Uploaded media can be large (video/image generation) - lift Apache's
# default 1MB ProxyPass body limit. Match this to whatever multer limit is
# actually configured in apps/api's upload pipeline if that's ever changed.
LimitRequestBody 0

<Location /api/v1>
  ProxyPass        http://127.0.0.1:3000/api/v1 retry=0 timeout=60
  ProxyPassReverse http://127.0.0.1:3000/api/v1
</Location>

<Location /storage/uploads>
  ProxyPass        http://127.0.0.1:3000/storage/uploads retry=0 timeout=60
  ProxyPassReverse http://127.0.0.1:3000/storage/uploads
</Location>

# Optional, forward-compatible: uncomment if a Socket.IO/WebSocket gateway
# is added to the API later. Requires mod_proxy_wstunnel (see above).
# <Location /socket.io>
#   ProxyPass        ws://127.0.0.1:3000/socket.io retry=0
#   ProxyPassReverse ws://127.0.0.1:3000/socket.io
# </Location>

ProxyPass        / http://127.0.0.1:3100/ retry=0 timeout=60
ProxyPassReverse / http://127.0.0.1:3100/

RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port "443"
